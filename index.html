<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARDINGLY POS</title>
<style>
:root{--bg:#f4f1ec;--card:#fff;--tx:#222;--mut:#777;--ac:#8b5a2b;--ok:#2e7d32;--bad:#c62828;--bd:#ddd}
@media(prefers-color-scheme:dark){:root{--bg:#1c1a18;--card:#2a2724;--tx:#eee;--mut:#999;--ac:#d09a5c;--bd:#444}}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;gap:6px;align-items:center;padding:8px 12px;background:var(--ac);color:#fff;flex-wrap:wrap}
header b{margin-right:auto}header button{background:#fff3;color:#fff;border:0;padding:8px 12px;border-radius:6px;cursor:pointer}
header button.on{background:#fff;color:var(--ac)}
main{padding:12px;max-width:1200px;margin:auto}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:8px 12px}
button.p{background:var(--ac);color:#fff;border:0}button.g{background:var(--ok);color:#fff;border:0}button.r{background:var(--bad);color:#fff;border:0}
input,select{font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);max-width:100%}
.grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.tbl{padding:18px 6px;text-align:center;border-radius:10px;border:2px solid var(--bd);background:var(--card)}
.tbl.busy{border-color:var(--bad)}.tbl small{display:block;color:var(--mut)}
.pos{display:grid;grid-template-columns:1fr 340px;gap:12px}@media(max-width:800px){.pos{grid-template-columns:1fr}}
.panel{background:var(--card);border-radius:10px;padding:10px;border:1px solid var(--bd)}
.dish{padding:14px 6px;text-align:center;background:var(--card)}.dish small{display:block;color:var(--mut)}
.row{display:flex;gap:6px;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd)}
.row.sent{opacity:.6}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left}
.tot{font-size:20px;font-weight:700}.mut{color:var(--mut)}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:9}
.modal>div{background:var(--card);padding:16px;border-radius:12px;min-width:280px;max-width:92vw;max-height:90vh;overflow:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chips button.on{background:var(--ac);color:#fff}
.k{border-left:5px solid var(--ac);margin:8px 0;padding:8px;background:var(--card);border-radius:8px}
@media print{header,.noprint{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const KEY='ardingly_pos_v1';
const money=n=>(Math.round(n*100)/100).toLocaleString('ru-RU',{minimumFractionDigits:0,maximumFractionDigits:2})+' ₸';
const uid=()=>Math.random().toString(36).slice(2,9);
const def=()=>({
 users:[{id:'u1',name:'Администратор',pin:'1111',role:'admin'},{id:'u2',name:'Кассир',pin:'2222',role:'cashier'},{id:'u3',name:'Официант',pin:'3333',role:'waiter'}],
 cats:[{id:'c1',name:'Горячие'},{id:'c2',name:'Холодные'},{id:'c3',name:'Десерты'}],
 dishes:[
  {id:'d1',cat:'c1',name:'Эспрессо',price:900,stock:100,station:'Бар'},
  {id:'d2',cat:'c1',name:'Американо',price:1000,stock:100,station:'Бар'},
  {id:'d3',cat:'c1',name:'Капучино',price:1400,stock:100,station:'Бар'},
  {id:'d4',cat:'c1',name:'Латте',price:1500,stock:100,station:'Бар'},
  {id:'d5',cat:'c2',name:'Айс-латте',price:1700,stock:100,station:'Бар'},
  {id:'d6',cat:'c2',name:'Колд брю',price:1600,stock:100,station:'Бар'},
  {id:'d7',cat:'c3',name:'Чизкейк',price:1800,stock:20,station:'Кухня'},
  {id:'d8',cat:'c3',name:'Круассан',price:1100,stock:20,station:'Кухня'}],
 mods:[{id:'m1',name:'Овсяное молоко',price:300},{id:'m2',name:'Доп. шот',price:250},{id:'m3',name:'Сироп',price:150}],
 discounts:[{id:'x1',name:'Скидка 10%',type:'pct',val:10},{id:'x2',name:'Скидка 500 ₸',type:'sum',val:500}],
 tables:Array.from({length:10},(_,i)=>({id:'t'+(i+1),name:'Стол '+(i+1)})),
 orders:[],checks:[],shift:null,shifts:[],seq:1,log:[]
});
let S=JSON.parse(localStorage.getItem(KEY)||'null')||def();
let ui={user:null,tab:'hall',order:null,cat:null};
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const log=t=>{S.log.unshift({t:new Date().toISOString(),u:ui.user?.name,m:t});S.log=S.log.slice(0,300)};
const can=r=>ui.user&&(ui.user.role==='admin'||(r==='cashier'&&ui.user.role==='cashier')||r==='waiter');
const sumOrder=o=>{const sub=o.items.filter(i=>!i.void).reduce((a,i)=>a+(i.price+i.mods.reduce((s,m)=>s+m.price,0))*i.qty,0);
 let d=0;if(o.disc)d=o.disc.type==='pct'?sub*o.disc.val/100:Math.min(o.disc.val,sub);return{sub,d,total:Math.max(0,sub-d)}};
const dish=id=>S.dishes.find(d=>d.id===id);
const orderOf=t=>S.orders.find(o=>o.table===t&&o.status==='open');

function render(){
 const a=$('#app');
 if(!ui.user){a.innerHTML=`<main style="max-width:340px;margin-top:10vh"><div class="panel"><h2>ARDINGLY POS</h2>
 <select id="lu" style="width:100%;margin-bottom:8px">${S.users.map(u=>`<option value="${u.id}">${u.name}</option>`).join('')}</select>
 <input id="pin" type="password" inputmode="numeric" placeholder="PIN" style="width:100%;margin-bottom:8px">
 <button class="p" style="width:100%" onclick="login()">Войти</button>
 <p class="mut">PIN по умолчанию: админ 1111, кассир 2222, официант 3333</p></div></main>`;return}
 const adm=ui.user.role==='admin';
 const tabs=[['hall','Зал'],['kitchen','Кухня'],['pay','Чеки'],['rep','Отчёты'],...(adm?[['menu','Меню'],['stock','Склад'],['staff','Персонал'],['sys','Система']]:[])];
 a.innerHTML=`<header><b>☕ ARDINGLY · ${ui.user.name}</b><span>${S.shift?'Смена №'+S.shift.n:'Смена закрыта'}</span>
 ${tabs.map(t=>`<button class="${ui.tab===t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}
 <button onclick="ui.user=null;render()">Выход</button></header><main>${view()}</main>`;
}
const go=t=>{ui.tab=t;ui.order=null;render()};
function login(){const u=S.users.find(x=>x.id===$('#lu').value);if(u&&u.pin===$('#pin').value){ui.user=u;ui.tab='hall';render()}else alert('Неверный PIN')}

function view(){return({hall:vHall,order:vOrder,kitchen:vKitchen,pay:vChecks,rep:vReports,menu:vMenu,stock:vStock,staff:vStaff,sys:vSys})[ui.order?'order':ui.tab]()}

function vHall(){
 const shift=S.shift?`<button class="r" onclick="closeShift()">Закрыть смену (Z)</button>`:`<button class="g" onclick="openShift()">Открыть смену</button>`;
 return `<div class="row noprint"><h3>Зал</h3>${can('cashier')?shift:''}</div><div class="grid">`+
 S.tables.map(t=>{const o=orderOf(t.id);return `<div class="tbl ${o?'busy':''}" onclick="openTable('${t.id}')"><b>${t.name}</b><small>${o?money(sumOrder(o).total):'свободен'}</small></div>`}).join('')+
 `<div class="tbl" onclick="openTable('takeaway')"><b>С собой</b><small>быстрый заказ</small></div></div>`}
function openShift(){const c=prompt('Наличных в кассе на начало, ₸','0');if(c===null)return;S.shift={n:S.seq++,open:new Date().toISOString(),by:ui.user.name,cash0:+c||0};log('Открыта смена');save();render()}
function closeShift(){if(S.orders.some(o=>o.status==='open'))return alert('Есть открытые заказы');
 if(!confirm('Закрыть смену?'))return;const r=shiftStats(S.shift);S.shifts.unshift({...S.shift,close:new Date().toISOString(),...r});S.shift=null;log('Закрыта смена');save();render()}
function openTable(t){if(!S.shift)return alert('Сначала откройте смену');
 let o=t==='takeaway'?null:orderOf(t);
 if(!o){o={id:uid(),num:S.seq++,table:t==='takeaway'?'takeaway'+uid():t,label:t==='takeaway'?'С собой':S.tables.find(x=>x.id===t).name,items:[],status:'open',by:ui.user.name,time:new Date().toISOString(),disc:null,guests:1};S.orders.push(o);save()}
 ui.order=o.id;ui.cat=S.cats[0]?.id;render()}
const cur=()=>S.orders.find(o=>o.id===ui.order);

function vOrder(){const o=cur(),s=sumOrder(o);
 return `<div class="row noprint"><button onclick="ui.order=null;render()">← Зал</button><b>Заказ №${o.num} · ${o.label}</b><span class="mut">гостей: <input type="number" min="1" value="${o.guests}" style="width:60px" onchange="cur().guests=+this.value;save()"></span></div>
 <div class="pos"><div><div class="chips">${S.cats.map(c=>`<button class="${ui.cat===c.id?'on':''}" onclick="ui.cat='${c.id}';render()">${c.name}</button>`).join('')}</div>
 <div class="grid">${S.dishes.filter(d=>d.cat===ui.cat).map(d=>`<button class="dish" ${d.stock<=0?'disabled':''} onclick="addDish('${d.id}')"><b>${d.name}</b><small>${money(d.price)}</small><small>ост. ${d.stock}</small></button>`).join('')}</div></div>
 <div class="panel">${o.items.map((i,x)=>`<div class="row ${i.sent?'sent':''}" style="${i.void?'text-decoration:line-through':''}"><div onclick="itemMenu(${x})" style="flex:1;cursor:pointer">${i.name} ×${i.qty}${i.mods.length?`<br><small class="mut">+ ${i.mods.map(m=>m.name).join(', ')}</small>`:''}${i.note?`<br><small class="mut">«${i.note}»</small>`:''}</div><b>${money((i.price+i.mods.reduce((a,m)=>a+m.price,0))*i.qty)}</b></div>`).join('')||'<p class="mut">Пусто</p>'}
 <div class="row"><span>Сумма</span><span>${money(s.sub)}</span></div>
 ${o.disc?`<div class="row"><span>${o.disc.name}</span><span>−${money(s.d)}</span></div>`:''}
 <div class="row tot"><span>Итого</span><span>${money(s.total)}</span></div>
 <div class="chips"><button onclick="sendKitchen()">На кухню</button><button onclick="pickDisc()">Скидка</button><button onclick="printPre()">Пречек</button>
 ${can('cashier')?`<button class="g" onclick="payModal()">Оплата</button>`:''}<button class="r" onclick="cancelOrder()">Отмена</button></div></div></div>`}
function addDish(id){const d=dish(id),o=cur();
 const ex=o.items.find(i=>i.dish===id&&!i.sent&&!i.mods.length&&!i.note&&!i.void);
 if(ex)ex.qty++;else o.items.push({id:uid(),dish:id,name:d.name,price:d.price,qty:1,mods:[],note:'',sent:false,void:false});save();render()}
function itemMenu(x){const o=cur(),i=o.items[x];if(i.void)return;
 modal(`<h3>${i.name}</h3><div class="chips"><button onclick="qty(${x},1)">＋</button><button onclick="qty(${x},-1)">−</button></div>
 <b>Модификаторы</b><div class="chips">${S.mods.map(m=>`<button class="${i.mods.some(q=>q.id===m.id)?'on':''}" onclick="toggleMod(${x},'${m.id}')">${m.name} +${m.price}</button>`).join('')}</div>
 <input placeholder="Комментарий" value="${i.note}" onchange="cur().items[${x}].note=this.value;save()" style="width:100%">
 <div class="chips"><button class="r" onclick="voidItem(${x})">${i.sent?'Сторно (админ)':'Удалить'}</button><button onclick="closeModal()">Готово</button></div>`)}
function qty(x,d){const i=cur().items[x];i.qty=Math.max(1,i.qty+d);save();itemMenu(x);bg()}
function toggleMod(x,id){const i=cur().items[x],m=S.mods.find(q=>q.id===id),k=i.mods.findIndex(q=>q.id===id);k>=0?i.mods.splice(k,1):i.mods.push({...m});save();itemMenu(x);bg()}
function voidItem(x){const o=cur(),i=o.items[x];if(i.sent){if(ui.user.role!=='admin')return alert('Сторно только администратор');log(`Сторно ${i.name} в заказе ${o.num}`);i.void=true}else o.items.splice(x,1);save();closeModal();render()}
const bg=()=>{const m=$('.modal');const h=$('main');if(h)h.innerHTML=view();};
function sendKitchen(){const o=cur();const n=o.items.filter(i=>!i.sent&&!i.void);if(!n.length)return;
 n.forEach(i=>{i.sent=true;i.sentAt=Date.now();const d=dish(i.dish);if(d)d.stock-=i.qty});log('Отправлено на кухню, заказ '+o.num);save();render()}
function pickDisc(){modal(`<h3>Скидка</h3><div class="chips">${S.discounts.map(d=>`<button onclick="setDisc('${d.id}')">${d.name}</button>`).join('')}<button onclick="setDisc('')">Убрать</button></div>`)}
function setDisc(id){const o=cur();if(!id)o.disc=null;else{if(ui.user.role==='waiter'){const p=prompt('PIN менеджера');if(!S.users.some(u=>u.role!=='waiter'&&u.pin===p))return alert('Нет доступа')}o.disc={...S.discounts.find(d=>d.id===id)};log('Скидка '+o.disc.name+' заказ '+o.num)}save();closeModal();render()}
function cancelOrder(){const o=cur();if(o.items.some(i=>i.sent)&&ui.user.role!=='admin')return alert('Отправленный заказ отменяет администратор');
 if(!confirm('Отменить заказ?'))return;o.items.filter(i=>i.sent&&!i.void).forEach(i=>{const d=dish(i.dish);if(d)d.stock+=i.qty});o.status='cancelled';log('Отмена заказа '+o.num);save();ui.order=null;render()}
function payModal(){const o=cur(),s=sumOrder(o);if(!o.items.length)return;
 modal(`<h3>Оплата: ${money(s.total)}</h3><div class="chips"><button class="g" onclick="pay('cash')">Наличные</button><button class="p" onclick="pay('card')">Карта</button><button onclick="paySplit()">Разделить оплату</button></div>
 <label>Чаевые, ₸ <input id="tip" type="number" value="0" style="width:90px"></label>`)}
function pay(type,parts){const o=cur(),s=sumOrder(o);const tip=+($('#tip')?.value)||0;let given=s.total;
 if(type==='cash'){const g=prompt('Принято от гостя, ₸',s.total);if(g===null)return;given=+g;if(given<s.total)return alert('Недостаточно')}
 const c={id:uid(),num:S.seq++,order:o.num,label:o.label,items:o.items.filter(i=>!i.void),disc:o.disc,sub:s.sub,d:s.d,total:s.total,tip,pays:parts||[{type,sum:s.total}],time:new Date().toISOString(),by:ui.user.name,waiter:o.by,shift:S.shift.n,guests:o.guests};
 S.checks.unshift(c);o.status='paid';log(`Оплата чека ${c.num} ${money(c.total)}`);save();closeModal();ui.order=null;
 if(type==='cash'&&given>s.total)alert('Сдача: '+money(given-s.total));printCheck(c)}
function paySplit(){const s=sumOrder(cur()).total;const c=+prompt('Наличными, ₸ (остальное картой)',Math.floor(s/2));if(isNaN(c)||c<0||c>s)return;
 pay('mix',[{type:'cash',sum:c},{type:'card',sum:s-c}])}
function receiptHTML(c,pre){return `<div style="font-family:monospace;max-width:300px"><center><b>ARDINGLY COFFEE</b><br>${pre?'ПРЕЧЕК':'Чек №'+c.num}<br>${new Date(c.time||Date.now()).toLocaleString('ru-RU')}</center><hr>
 ${c.items.map(i=>`${i.name} ×${i.qty}${i.mods.length?' (+'+i.mods.map(m=>m.name).join(',')+')':''}<span style="float:right">${money((i.price+i.mods.reduce((a,m)=>a+m.price,0))*i.qty)}</span><br>`).join('')}<hr>
 ${c.d?`Скидка: −${money(c.d)}<br>`:''}<b>ИТОГО: ${money(c.total)}</b>${c.pays?'<br>'+c.pays.map(p=>(p.type==='cash'?'Нал: ':'Карта: ')+money(p.sum)).join(' · '):''}${c.tip?'<br>Чаевые: '+money(c.tip):''}<br><center>Спасибо!</center></div>`}
function printCheck(c){modal(receiptHTML(c)+`<div class="chips noprint"><button onclick="window.print()">Печать</button><button onclick="closeModal();render()">Закрыть</button></div>`)}
function printPre(){const o=cur(),s=sumOrder(o);modal(receiptHTML({items:o.items.filter(i=>!i.void),...s,time:Date.now()},true)+`<div class="chips noprint"><button onclick="window.print()">Печать</button><button onclick="closeModal()">Закрыть</button></div>`)}

function vKitchen(){const q=S.orders.filter(o=>o.status==='open').map(o=>({o,it:o.items.filter(i=>i.sent&&!i.done&&!i.void)})).filter(x=>x.it.length);
 return `<h3>Экран кухни / бара</h3>`+(q.map(({o,it})=>`<div class="k"><b>№${o.num} · ${o.label}</b> <span class="mut">${Math.round((Date.now()-it[0].sentAt)/60000)} мин</span>
 ${it.map(i=>`<div class="row"><span>${i.name} ×${i.qty}${i.mods.length?' + '+i.mods.map(m=>m.name).join(', '):''}${i.note?' «'+i.note+'»':''}</span><button class="g" onclick="done('${o.id}','${i.id}')">Готово</button></div>`).join('')}</div>`).join('')||'<p class="mut">Очередь пуста</p>')}
function done(o,i){S.orders.find(x=>x.id===o).items.find(x=>x.id===i).done=true;save();render()}

function vChecks(){return `<h3>Чеки</h3><table><tr><th>№</th><th>Время</th><th>Стол</th><th>Сумма</th><th>Оплата</th><th></th></tr>${S.checks.slice(0,100).map(c=>`<tr><td>${c.num}</td><td>${new Date(c.time).toLocaleString('ru-RU')}</td><td>${c.label}</td><td>${money(c.total)}</td><td>${c.pays.map(p=>p.type==='cash'?'нал':'карта').join('+')}</td><td><button onclick='printCheck(S.checks.find(x=>x.id=="${c.id}"))'>Открыть</button>${ui.user.role==='admin'?` <button class="r" onclick="refund('${c.id}')">Возврат</button>`:''}</td></tr>`).join('')}</table>`}
function refund(id){if(!confirm('Сделать возврат чека?'))return;const k=S.checks.findIndex(c=>c.id===id);S.checks[k].items.forEach(i=>{const d=dish(i.dish);if(d)d.stock+=i.qty});log('Возврат чека '+S.checks[k].num);S.checks.splice(k,1);save();render()}

function shiftStats(sh){const cs=S.checks.filter(c=>c.shift===sh.n);let cash=0,card=0,tips=0,disc=0;
 cs.forEach(c=>{c.pays.forEach(p=>p.type==='cash'?cash+=p.sum:card+=p.sum);tips+=c.tip;disc+=c.d});
 const rev=cash+card;return{count:cs.length,cash,card,tips,disc,rev,avg:cs.length?rev/cs.length:0,guests:cs.reduce((a,c)=>a+c.guests,0)}}
function vReports(){const sh=S.shift;const r=sh?shiftStats(sh):null;
 const agg={};S.checks.forEach(c=>c.items.forEach(i=>{agg[i.name]=agg[i.name]||{q:0,s:0};agg[i.name].q+=i.qty;agg[i.name].s+=(i.price+i.mods.reduce((a,m)=>a+m.price,0))*i.qty}));
 const byW={};S.checks.forEach(c=>{byW[c.waiter]=(byW[c.waiter]||0)+c.total});
 return `<h3>Отчёты</h3>${r?`<div class="panel"><b>X-отчёт (текущая смена №${sh.n})</b><table><tr><td>Чеков</td><td>${r.count}</td></tr><tr><td>Выручка</td><td>${money(r.rev)}</td></tr><tr><td>Наличные</td><td>${money(r.cash)}</td></tr><tr><td>Карта</td><td>${money(r.card)}</td></tr><tr><td>Скидки</td><td>${money(r.disc)}</td></tr><tr><td>Чаевые</td><td>${money(r.tips)}</td></tr><tr><td>Средний чек</td><td>${money(r.avg)}</td></tr><tr><td>В кассе</td><td>${money(sh.cash0+r.cash)}</td></tr></table></div>`:'<p class="mut">Смена не открыта</p>'}
 <h4>Продажи по блюдам (всё время)</h4><table>${Object.entries(agg).sort((a,b)=>b[1].s-a[1].s).map(([n,v])=>`<tr><td>${n}</td><td>${v.q} шт</td><td>${money(v.s)}</td></tr>`).join('')}</table>
 <h4>По официантам</h4><table>${Object.entries(byW).map(([n,v])=>`<tr><td>${n}</td><td>${money(v)}</td></tr>`).join('')}</table>
 <h4>Закрытые смены (Z)</h4><table>${S.shifts.map(s=>`<tr><td>№${s.n}</td><td>${new Date(s.open).toLocaleString('ru-RU')}</td><td>${s.count} чек.</td><td>${money(s.rev)}</td></tr>`).join('')}</table>
 <button onclick="exportCSV()">Экспорт чеков CSV</button>`}
function exportCSV(){const rows=[['№','Время','Стол','Сумма','Скидка','Чаевые','Кассир']].concat(S.checks.map(c=>[c.num,c.time,c.label,c.total,c.d,c.tip,c.by]));
 const b=new Blob(['\ufeff'+rows.map(r=>r.join(';')).join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='checks.csv';a.click()}

function vMenu(){return `<h3>Меню</h3><div class="chips"><button onclick="addCat()">+ Категория</button><button onclick="addDishF()">+ Блюдо</button><button onclick="addSimple('mods','Модификатор')">+ Модификатор</button><button onclick="addDisc()">+ Скидка</button><button onclick="addTable()">+ Стол</button></div>
 <table>${S.dishes.map(d=>`<tr><td>${d.name}</td><td>${S.cats.find(c=>c.id===d.cat)?.name||''}</td><td>${money(d.price)}</td><td><button onclick="editDish('${d.id}')">Изм.</button> <button class="r" onclick="delDish('${d.id}')">×</button></td></tr>`).join('')}</table>
 <p class="mut">Категории: ${S.cats.map(c=>`${c.name} <a href="#" onclick="delCat('${c.id}');return false">×</a>`).join(', ')}<br>Модификаторы: ${S.mods.map(m=>`${m.name} (${m.price}) <a href="#" onclick="delFrom('mods','${m.id}');return false">×</a>`).join(', ')}<br>Скидки: ${S.discounts.map(m=>`${m.name} <a href="#" onclick="delFrom('discounts','${m.id}');return false">×</a>`).join(', ')}</p>`}
function addCat(){const n=prompt('Название');if(n){S.cats.push({id:uid(),name:n});save();render()}}
function delCat(id){if(S.dishes.some(d=>d.cat===id))return alert('В категории есть блюда');S.cats=S.cats.filter(c=>c.id!==id);save();render()}
function addDishF(){if(!S.cats.length)return alert('Создайте категорию');const n=prompt('Название');if(!n)return;const p=+prompt('Цена, ₸');
 const c=prompt('Категория: '+S.cats.map((c,i)=>`${i+1}=${c.name}`).join(', '),'1');S.dishes.push({id:uid(),cat:(S.cats[+c-1]||S.cats[0]).id,name:n,price:p||0,stock:100,station:'Бар'});save();render()}
function editDish(id){const d=dish(id);const n=prompt('Название',d.name);if(n===null)return;d.name=n;d.price=+prompt('Цена',d.price)||d.price;save();render()}
function delDish(id){if(confirm('Удалить?')){S.dishes=S.dishes.filter(d=>d.id!==id);save();render()}}
function addSimple(k,l){const n=prompt(l);if(!n)return;S[k].push({id:uid(),name:n,price:+prompt('Цена, ₸','0')||0});save();render()}
function addDisc(){const n=prompt('Название');if(!n)return;const t=confirm('OK = процент, Отмена = сумма')?'pct':'sum';S.discounts.push({id:uid(),name:n,type:t,val:+prompt('Размер')||0});save();render()}
function delFrom(k,id){S[k]=S[k].filter(x=>x.id!==id);save();render()}
function addTable(){S.tables.push({id:uid(),name:prompt('Название стола','Стол '+(S.tables.length+1))||'Стол'});save();render()}

function vStock(){return `<h3>Склад (остатки)</h3><table>${S.dishes.map(d=>`<tr><td>${d.name}</td><td style="color:${d.stock<=5?'var(--bad)':'inherit'}">${d.stock}</td><td><button onclick="restock('${d.id}')">Приход</button> <button onclick="inv('${d.id}')">Инвентаризация</button></td></tr>`).join('')}</table>`}
function restock(id){const n=+prompt('Сколько приходуем?');if(n>0){dish(id).stock+=n;log('Приход '+dish(id).name+' '+n);save();render()}}
function inv(id){const n=prompt('Фактический остаток',dish(id).stock);if(n!==null){dish(id).stock=+n;log('Инвентаризация '+dish(id).name);save();render()}}

function vStaff(){return `<h3>Персонал</h3><button onclick="addUser()">+ Сотрудник</button><table>${S.users.map(u=>`<tr><td>${u.name}</td><td>${{admin:'Админ',cashier:'Кассир',waiter:'Официант'}[u.role]}</td><td><button onclick="pinUser('${u.id}')">Сменить PIN</button> ${u.id!==ui.user.id?`<button class="r" onclick="delFrom('users','${u.id}')">×</button>`:''}</td></tr>`).join('')}</table>`}
function addUser(){const n=prompt('Имя');if(!n)return;const r=prompt('Роль: admin / cashier / waiter','waiter');S.users.push({id:uid(),name:n,pin:prompt('PIN','0000'),role:['admin','cashier','waiter'].includes(r)?r:'waiter'});save();render()}
function pinUser(id){const p=prompt('Новый PIN');if(p){S.users.find(u=>u.id===id).pin=p;save();alert('Готово')}}

function vSys(){return `<h3>Система</h3><div class="chips"><button onclick="backup()">Скачать резервную копию</button><button onclick="$('#rf').click()">Восстановить</button><button class="r" onclick="if(confirm('Стереть ВСЕ данные?')){localStorage.removeItem(KEY);location.reload()}">Сброс</button></div><input id="rf" type="file" hidden onchange="restore(this.files[0])">
 <h4>Журнал действий</h4><table>${S.log.slice(0,60).map(l=>`<tr><td>${new Date(l.t).toLocaleString('ru-RU')}</td><td>${l.u||''}</td><td>${l.m}</td></tr>`).join('')}</table>`}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='pos-backup.json';a.click()}
function restore(f){const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();location.reload()}catch(e){alert('Ошибка файла')}};r.readAsText(f)}

function modal(h){closeModal();const m=document.createElement('div');m.className='modal';m.innerHTML='<div>'+h+'</div>';m.onclick=e=>{if(e.target===m)closeModal()};document.body.appendChild(m)}
function closeModal(){document.querySelectorAll('.modal').forEach(m=>m.remove());if(ui.user)render()}
render();setInterval(()=>{if(ui.tab==='kitchen'&&!ui.order&&!$('.modal'))render()},30000);
</script>
</body>
</html>
